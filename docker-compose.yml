services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visitoring
      POSTGRES_USER: visitoring
      POSTGRES_PASSWORD: visitoring
    ports:
      - "5433:5432"
    volumes:
      - visitoring-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitoring -d visitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  visitoring-postgres:
